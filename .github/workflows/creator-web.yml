name: Creator Web checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/cocos
          key: cocos-3.8.8-411f98df-ccbuild-2.3.23-v1
      - run: npm run engine:prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: greyline-creator-web
          path: dist/
