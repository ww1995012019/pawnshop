<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="轨道旧货局">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <meta name="full-screen" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#10161F">
  <meta name="description" content="轨道旧货局，使用 Cocos Creator 引擎开发的空间站经营网页游戏。鉴定、维修、仓储安检与订单交付。">
  <title>轨道旧货局 · 回环九号</title>
  <link rel="icon" href="./favicon.svg">
  <style>
    @font-face{font-family:'Orbital Sans SC';src:url('./resources/fonts/orbital-sans.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'Orbital Mono';src:url('./resources/fonts/orbital-mono.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:#0B111B;color:#E4EBE7}
    body{font-family:'Orbital Sans SC','Noto Sans CJK SC',sans-serif}#GameDiv{width:100%;height:100%;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #Cocos3dGameContainer{width:100%;height:100%}canvas{display:block;touch-action:none;outline:none;width:100%;height:100%}
    #loading{position:fixed;inset:0;z-index:10;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1B303D,#0B111B 75%)}
    #loading h1{font-size:clamp(32px,4vw,56px);font-weight:400;letter-spacing:.15em;color:#6EE0DE;margin:0 0 14px}
    #loading p{font-size:16px;letter-spacing:.1em;color:#91A9B6}#loading span{display:block;margin:28px auto;width:52px;height:3px;background:#DB8A52;animation:breathe 1.6s infinite}
    #loading.failed{background:#10161F}#loading button{font:inherit;border:1px solid #bea15f;background:#294939;color:#f0dfb6;padding:12px 30px;margin:18px auto;cursor:pointer}
    @keyframes breathe{50%{opacity:.2;transform:scaleX(2)}}@media(prefers-reduced-motion:reduce){#loading span{animation:none}}
  </style>
</head>
<body>
  <main id="GameDiv" aria-label="轨道旧货局游戏">
    <div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0" aria-label="轨道旧货局，鼠标拖动物品，1–6选择工具，Esc返回"></canvas></div>
  </main>
  <div id="loading" role="status"><h1>轨道旧货局</h1><p>每件旧物，都有下一程</p><span></span><p id="load-status">正在接通回环九号…</p></div>
  <script type="module" src="./game.js?v=3be3cbbb489c"></script>
</body>
</html>
