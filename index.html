	<style>
:root {

}
.screen-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.screen-heading span { color: #a9c6b3; font-size: 13px; }

.track { height: 15px; padding: 3px; background: #101c20; border: 1px solid #5f796d; }

.track.indeterminate .fill { width: 28% !important; animation: sweep 1.4s steps(16,end) infinite; }
@keyframes sweep { from { transform: translateX(0); } to { transform: translateX(255%); } }
.readout { display: flex; justify-content: space-between; margin-top: 7px; color: var(--muted); font: 12px var(--mono); }
.readout b { color: var(--amber); font-weight: 600; }
#stage { margin-top: 12px; color: var(--paper); font-size: 15px; min-height: 1.5em; }
#tip { margin: 15px 4px 0; color: #b8b7a6; font-size: 13px; line-height: 1.6; min-height: 3.2em; transition: opacity .25s; }
#tip::before { content: "店内须知 · "; color: var(--amber); }
#fail { display: none; margin: 15px 4px 0; }
#loader.failed #fail { display: block; }
#loader.failed .gauge, #loader.failed #tip { display: none; }
#fail p { color: #f1caa0; font-size: 15px; line-height: 1.6; margin: 0 0 14px; white-space: pre-line; }
#retry { font: inherit; min-width: 156px; min-height: 42px; cursor: pointer; color: #f7e9cc; background: #856b4e; border: 2px solid #c8a879; box-shadow: 0 3px #27202a; }
#retry:hover, #retry:focus-visible { background: #a1825a; outline: 2px solid var(--paper); }
#retry:active { transform: translateY(2px); box-shadow: 0 1px #27202a; }
@media (max-width: 440px) { .panel { padding: 14px; } .motto { display: none; } }
@media (max-height: 520px) { .panel { padding: 12px 16px; } .plate { padding-bottom: 7px; } .gauge { padding: 9px 14px; } #tip { display: none; } }
@media (prefers-reduced-motion: reduce) { #loader, .fill, #tip { transition: none; } .track.indeterminate .fill { animation: none; width: 100% !important; opacity: .6; } }

	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"executable":"engine-309843874cfdebe8","mainPack":"workbench-819119bd99558981.pck","fileSizes":{"workbench-819119bd99558981.pck":2242660,"engine-309843874cfdebe8.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"ensureCrossOriginIsolationHeaders":false,"transport":{"workbench-819119bd99558981.pck":{"sha256":"819119bd99558981e0c55ec725d91a3712c081d154795cd784ec6bc42168f37f","bytes":2242660,"type":"application/octet-stream","gzip":"workbench-819119bd99558981.pck.gz","gzipBytes":2023950},"engine-309843874cfdebe8.wasm":{"sha256":"26b61ce95247012ab3dca3ff51e96d1cdbff44ee91a8c20a83e150afca83f1b6","bytes":37700666,"type":"application/wasm","gzip":"engine-309843874cfdebe8.wasm.gz","gzipBytes":9382282},"music-8ad9f8f323428f98.ogg":{"sha256":"8ad9f8f323428f98804c867c2ca5c00c4e16885b804aa64650471b6b6d005b9c","bytes":846727,"type":"audio/ogg","gzip":null,"gzipBytes":846727},"music-73c915ee8894b734.ogg":{"sha256":"73c915ee8894b734dc255384aaf0c1ae2834b3d1fee00a62025bb5954849d7f3","bytes":654520,"type":"audio/ogg","gzip":null,"gzipBytes":654520},"music-f06ef4243f86b03f.ogg":{"sha256":"f06ef4243f86b03f6f7ed0719e450a193c826c1d94988d9eb357f73a6c296570","bytes":809644,"type":"audio/ogg","gzip":null,"gzipBytes":809644},"music-30ff78a0e0f53f91.ogg":{"sha256":"30ff78a0e0f53f91658c4ebd0a6c827c92dffdc59803f270ed0689288766778d","bytes":397829,"type":"audio/ogg","gzip":null,"gzipBytes":397829}},"music":{"shop":"music-8ad9f8f323428f98.ogg","workbench":"music-73c915ee8894b734.ogg","storeroom":"music-f06ef4243f86b03f.ogg","ledger":"music-30ff78a0e0f53f91.ogg"},"previousAssets":["workbench-2da0eded4d37632b.pck","engine-309843874cfdebe8.wasm","music-8ad9f8f323428f98.ogg","music-73c915ee8894b734.ogg","music-f06ef4243f86b03f.ogg","music-30ff78a0e0f53f91.ogg"]};
const GODOT_THREADS_ENABLED = false;
window.OrbitalAssets.install(GODOT_CONFIG);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const track = document.getElementById('track');
	const fill = document.getElementById('fill');
	const pct = document.getElementById('pct');
	const bytes = document.getElementById('bytes');
	const stage = document.getElementById('stage');
	const tip = document.getElementById('tip');
	const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

	const TIPS = [
		'放大镜看标识，紫外线读编号，称重核对配置；对照说明书再出价。',
		'接受报价只是锁价，确认交割才真正付钱拿货，花 1 点行动。',
		'来源不明的货要先扫描、登记，或者放进隔离柜。',
		'维修的三道工序做完后才扣材料与行动点，中途离开不吃亏。',
		'第 7、14、21 天要交租金，留够现金再打烊。',
		'委修单必须交还顾客的原物，别拿店里的同款顶替。',
	];
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	function nextTip() {
		tip.style.opacity = 0;
		setTimeout(() => {
			tip.textContent = TIPS[tipIndex % TIPS.length];
			tipIndex += 1;
			tip.style.opacity = 1;
		}, reduced ? 0 : 350);
	}
	nextTip();
	const tipTimer = setInterval(nextTip, 5200);

	const mb = (n) => (n / 1048576).toFixed(1);
	let finished = false;

	function fail(err) {
		console.error(err);
		finished = true;
		clearInterval(tipTimer);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : '');
		document.getElementById('fail-text').textContent = '店铺暂时没有接通。\n请检查网络后重试。' + (msg ? '\n（' + msg + '）' : '');
		loader.classList.add('failed');
		stage.textContent = '';
	}
	document.getElementById('retry').addEventListener('click', () => location.reload());

	function open() {
		finished = true;
		clearInterval(tipTimer);
		fill.style.width = '100%';
		pct.textContent = '100%';
		track.setAttribute('aria-valuenow', '100');
		stage.textContent = '开门营业';
		// Gently reveal the same shop behind the loading panel.
		setTimeout(() => {
			if (reduced) { loader.remove(); return; }
			loader.classList.add('opening');
			setTimeout(() => loader.remove(), 400);
		}, 250);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('浏览器缺少运行所需的功能：' + missing.join('、'));
		return;
	}

	let downloaded = false;
	window.OrbitalAssets.onProgress = (current, total) => {
		const p = Math.min(100, Math.floor(current / total * 100));
		fill.style.width = p + '%'; pct.textContent = p + '%';
		track.setAttribute('aria-valuenow', String(p));
		bytes.textContent = mb(current) + ' / ' + mb(total) + ' MB';
		downloaded = current >= total;
		stage.textContent = downloaded ? '正在通电、点亮柜台…' : '正在读取压缩货架与库存…';
	};
	window.OrbitalTouch.whenLandscape().then(() => Promise.all([
		// Observe the public load Promise too: vendor init does not forward WASM failures.
		Engine.load(GODOT_CONFIG.executable, GODOT_CONFIG.fileSizes[GODOT_CONFIG.executable + '.wasm']),
		engine.startGame({
		'onProgress': function (current, total) {
			if (finished) return;
			if (downloaded) stage.textContent = '正在通电、点亮柜台…';
		},
	})])).then(open, fail);
}());
