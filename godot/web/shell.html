<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#28232e">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="轨道旧货局">
	<meta name="description" content="轨道旧货局：空间站旧货铺经营游戏。鉴定、议价、维修、仓储与订单。">
	<title>轨道旧货局 · 回环九号</title>
	<style>
:root {
	--ink: #211c26; --frame: #756963; --frame-light: #aa9277;
	--metal: #3d4141; --screen: #1b3534; --amber: #e9bd79;
	--paper: #eadbc0; --muted: #a7b3a7; --sage: #80aa96;
	--sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
	--mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); touch-action: none; }
body { color: var(--paper); font-family: var(--sans); -webkit-user-select: none; user-select: none; }
#canvas { display: block; outline: none; }
#loader {
	position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
	background: linear-gradient(rgba(23,19,28,.53),rgba(23,19,28,.64)), url("loading-shop.png") center / cover no-repeat, #28232e;
	image-rendering: pixelated;
	transition: opacity .35s ease;
}
#loader.opening { opacity: 0; pointer-events: none; }

.loading-title { position:absolute; top:max(20px,env(safe-area-inset-top)); left:clamp(20px,4vw,64px); margin:0; font-size:clamp(18px,2.4vw,26px); letter-spacing:.12em; color:#d7c7ac; font-weight:500; }
#loading-cast { display:flex; flex-direction:column; align-items:center; justify-content:center; width:min(680px,84%); gap:12px; padding-bottom:48px; text-align:center; transition:opacity .3s; }
#loading-portrait { width:clamp(130px,24vh,230px); aspect-ratio:1; background-image:url("loading-cast.webp"); background-size:600% 600%; image-rendering:pixelated; animation:breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform:translateY(0) rotate(-.5deg); } 50% { transform:translateY(-5px) rotate(.5deg); } }
#loading-name { margin:0; color:var(--amber); font-size:clamp(14px,2vw,18px); letter-spacing:.15em; }
#loading-line { margin:0; max-width:100%; min-height:3em; font-size:clamp(16px,2.2vw,23px); line-height:1.7; text-wrap:balance; color:#f0e5cf; text-shadow:0 2px 4px #17131c; }
#loading-bottom { position:absolute; left:clamp(16px,3vw,48px); right:clamp(16px,3vw,48px); bottom:max(14px,env(safe-area-inset-bottom)); }
#pct { display:block; margin-bottom:8px; color:var(--paper); text-align:right; font:14px var(--mono); }
.track { height:7px; background:#181e20; overflow:hidden; }
.fill { width:0; height:100%; background:#dfbc80; transition:width .2s ease-out; }
#fail { display:none; position:absolute; inset:20%; place-content:center; text-align:center; }
#loader.failed #fail { display:grid; }
#loader.failed #loading-cast, #loader.failed #loading-bottom { display:none; }
#fail p { color:#f1caa0; font-size:16px; line-height:1.7; white-space:pre-line; }
#retry { justify-self:center; font:inherit; min-width:156px; min-height:44px; cursor:pointer; color:#f7e9cc; background:#856b4e; border:2px solid #c8a879; }
#retry:hover, #retry:focus-visible { background:#a1825a; outline:2px solid var(--paper); }
@media (max-height:520px) { #loading-cast { gap:6px; padding-bottom:26px; } #loading-portrait { width:clamp(80px,30vh,145px); } .loading-title { top:14px; } #loading-line { min-height:2.8em; font-size:16px; } }
html.turned #loading-cast { gap:6px; padding-bottom:26px; }
html.turned #loading-portrait { width:clamp(80px,30vw,145px); }
html.turned #loading-line { min-height:2.8em; font-size:16px; }
html.turned .loading-title { top:14px; }
@media (prefers-reduced-motion:reduce) { #loader, .fill, #loading-cast { transition:none; } #loading-portrait { animation:none; } }

	</style>
	<link rel="stylesheet" href="web-ui.css">
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">你的浏览器不支持画布。</canvas>
	<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#ece7d9">需要开启 JavaScript 才能开门营业。</div></noscript>

	<div id="loader" role="status" aria-live="polite">
		<h1 class="loading-title">轨道旧货局</h1>
		<div id="loading-cast" aria-live="off">
			<div id="loading-portrait" role="img" aria-label="旧港来客"></div>
			<p id="loading-name"></p>
			<p id="loading-line"></p>
		</div>
		<div id="loading-bottom">
			<span id="pct">0%</span>
			<div class="track" id="track" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
		</div>
		<div id="fail"><p id="fail-text"></p><button id="retry" type="button">重新开门</button></div>
	</div>

	<script src="asset-loader.js"></script>
	<script src="web-ui.js"></script>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
window.OrbitalAssets.install(GODOT_CONFIG);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const track = document.getElementById('track');
	const fill = document.getElementById('fill');
	const pct = document.getElementById('pct');
	const cast = $LOADING_CAST;
	const speaker = document.getElementById('loading-cast');
	const portrait = document.getElementById('loading-portrait');
	const name = document.getElementById('loading-name');
	const line = document.getElementById('loading-line');
	const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	let queue = [], lastId = null, swapTimer;
	function nextSpeaker() {
		if (!queue.length) {
			queue = [...cast];
			for (let i=queue.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
			if (queue.length>1 && queue[queue.length-1].id===lastId) [queue[0],queue[queue.length-1]]=[queue[queue.length-1],queue[0]];
		}
		const person = queue.pop(); lastId = person.id;
		speaker.style.opacity = '0';
		swapTimer = setTimeout(() => {
			portrait.style.backgroundPosition = `${person.slot%6*20}% ${Math.floor(person.slot/6)*20}%`;
			portrait.setAttribute('aria-label', person.name);
			name.textContent = person.name;
			line.textContent = '“' + person.line + '”';
			speaker.style.opacity = '1';
		}, reduced ? 0 : 300);
	}
	nextSpeaker();
	const castTimer = setInterval(nextSpeaker, 5200);
	let finished = false;

	function fail(err) {
		console.error(err);
		finished = true;
		clearInterval(castTimer);
		clearTimeout(swapTimer);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : '');
		document.getElementById('fail-text').textContent = '店铺暂时没有接通。\n请检查网络后重试。' + (msg ? '\n（' + msg + '）' : '');
		loader.classList.add('failed');
	}
	document.getElementById('retry').addEventListener('click', () => location.reload());

	function open() {
		finished = true;
		clearInterval(castTimer);
		clearTimeout(swapTimer);
		fill.style.width = '100%';
		pct.textContent = '100%';
		track.setAttribute('aria-valuenow', '100');
		// Gently reveal the same shop behind the loading panel.
		setTimeout(() => {
			if (reduced) { loader.remove(); return; }
			loader.classList.add('opening');
			setTimeout(() => loader.remove(), 400);
		}, 250);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('浏览器缺少运行所需的功能：' + missing.join('、'));
		return;
	}

	let downloaded = false;
	window.OrbitalAssets.onProgress = (current, total) => {
		if (finished || !Number.isFinite(total) || total <= 0) return;
		const p = Math.min(95, Math.floor(current / total * 95));
		fill.style.width = p + '%'; pct.textContent = p + '%';
		track.setAttribute('aria-valuenow', String(p));
		downloaded = current >= total;
	};
	Promise.all([
		// Observe the public load Promise too: vendor init does not forward WASM failures.
		Engine.load(GODOT_CONFIG.executable, GODOT_CONFIG.fileSizes[GODOT_CONFIG.executable + '.wasm']),
		engine.startGame({
		'onProgress': function (current, total) {
			if (finished) return;
			if (downloaded) { fill.style.width = '98%'; pct.textContent = '98%'; track.setAttribute('aria-valuenow', '98'); }
		},
	})]).then(open, fail);
}());
	</script>
</body>
</html>
