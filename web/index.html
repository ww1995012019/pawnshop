<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172d25">
  <meta name="description" content="灰线旧货铺，使用 Cocos Creator 引擎开发的七日旧物经营网页游戏。亲手鉴定、议价与摆放旧物。">
  <title>灰线旧货铺 · 旧物有新生</title>
  <link rel="icon" href="./favicon.svg">
  <style>
    @font-face{font-family:'Greyline Serif';src:url('./resources/fonts/greyline-serif.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101e19;color:#eddfbe}
    body{font-family:'Greyline Serif','Noto Serif CJK SC',serif}#GameDiv{width:100%;height:100%;position:relative}
    #Cocos3dGameContainer{width:100%;height:100%}canvas{display:block;touch-action:none;outline:none;width:100%;height:100%}
    #loading{position:fixed;inset:0;z-index:10;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#294b3b,#101e19 75%)}
    #loading h1{font-size:clamp(32px,4vw,56px);font-weight:400;letter-spacing:.15em;color:#e0c88b;margin:0 0 14px}
    #loading p{font-size:16px;letter-spacing:.1em;color:#b8b694}#loading span{display:block;margin:28px auto;width:52px;height:3px;background:#d7b66b;animation:breathe 1.6s infinite}
    #loading.failed{background:#18251f}#loading button{font:inherit;border:1px solid #bea15f;background:#294939;color:#f0dfb6;padding:12px 30px;margin:18px auto;cursor:pointer}
    @keyframes breathe{50%{opacity:.2;transform:scaleX(2)}}@media(prefers-reduced-motion:reduce){#loading span{animation:none}}
  </style>
</head>
<body>
  <main id="GameDiv" aria-label="灰线旧货铺游戏">
    <div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0" aria-label="灰线旧货铺，鼠标拖动物品，I打开库存，Esc返回"></canvas></div>
  </main>
  <div id="loading" role="status"><h1>灰线旧货铺</h1><p>旧物有来处，灯火有归人</p><span></span><p id="load-status">正在点亮旧站台…</p></div>
  <script type="module" src="./game.js"></script>
</body>
</html>
